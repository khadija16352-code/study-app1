<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Quest</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    transition: .4s;
    overflow: hidden;
}

/* =========================
   BACKGROUNDS
========================= */

body.neutral {
    background:
        radial-gradient(circle at 15% 20%, white 0 5%, transparent 6%),
        linear-gradient(135deg, #e8e9ff, #f8f8ff);
}

body.girl {
    background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.8) 0 6%, transparent 7%),
        radial-gradient(circle at 85% 25%, rgba(255,255,255,.7) 0 5%, transparent 6%),
        linear-gradient(135deg, #ffd6ea, #e7d8ff);
}

body.boy {
    background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.7) 0 6%, transparent 7%),
        radial-gradient(circle at 85% 25%, rgba(255,255,255,.6) 0 5%, transparent 6%),
        linear-gradient(135deg, #ccecff, #d9d8ff);
}

/* =========================
   LOGIN
========================= */

#loginScreen {
    min-height: 100vh;
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.login-card {
    width: 100%;
    max-width: 470px;

    background: rgba(255,255,255,.9);
    backdrop-filter: blur(18px);

    border-radius: 30px;
    padding: 38px;

    box-shadow:
        0 25px 70px rgba(50,40,100,.15);
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
}

/* =========================
   LANGUAGE
========================= */

.language-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

.languages {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
}

.language {
    padding: 13px;

    border: 2px solid #eee;
    border-radius: 13px;

    background: white;

    cursor: pointer;
    font-size: 15px;

    transition: .2s;
}

.language:hover {
    transform: translateY(-2px);
}

.language.active {
    border-color: #806cff;
    background: #f4f1ff;
}

/* =========================
   INPUTS
========================= */

.input-group {
    margin-bottom: 18px;
}

label {
    display: block;

    font-size: 14px;
    font-weight: bold;

    margin-bottom: 8px;
}

input,
select {

    width: 100%;

    padding: 14px;

    border: 2px solid #eee;
    border-radius: 13px;

    outline: none;

    font-size: 15px;

    background: white;

}

input:focus,
select:focus {
    border-color: #806cff;
}

/* =========================
   GENDER
========================= */

.gender-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

.gender-buttons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 25px;
}

.gender {

    padding: 16px;

    border-radius: 15px;

    border: 2px solid #eee;

    background: white;

    cursor: pointer;

    font-size: 16px;

    transition: .2s;
}

.gender:hover {
    transform: translateY(-2px);
}

.gender.selected.girl {

    border-color: #ff72ae;

    background: #fff0f7;
}

.gender.selected.boy {

    border-color: #4d9cff;

    background: #eef7ff;
}

/* =========================
   CONTINUE
========================= */

.continue {

    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 15px;

    background: #806cff;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.continue:hover {

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(128,108,255,.25);
}

/* =========================
   CUSTOMIZE SCREEN
========================= */

#customizeScreen {

    display: none;

    min-height: 100vh;

    padding: 30px;
}

.customize {

    max-width: 1100px;

    height: calc(100vh - 60px);

    margin: auto;

    display: grid;

    grid-template-columns: 1fr 1fr;

    overflow: hidden;

    background: rgba(255,255,255,.9);

    backdrop-filter: blur(20px);

    border-radius: 35px;

    box-shadow:
        0 25px 80px rgba(50,40,100,.15);
}

/* =========================
   CHARACTER AREA
========================= */

.character-area {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;
}

.character-title {

    font-size: 28px;

    font-weight: 800;

    margin-bottom: 25px;
}

/* =========================
   CHARACTER
========================= */

.character {

    width: 300px;

    height: 430px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    position: relative;

    animation: floating 3s ease-in-out infinite;
}

@keyframes floating {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

/* =========================
   HEAD
========================= */

.head {

    width: 120px;

    height: 130px;

    border-radius:
        50% 50%
        45% 45%;

    background: #f3c7a5;

    position: relative;

    z-index: 5;
}

/* =========================
   HAIR
========================= */

.hair {

    position: absolute;

    top: -22px;

    left: -10px;

    width: 140px;

    height: 82px;

    border-radius:
        70px 70px
        35px 35px;

    background: #4b3428;

    z-index: 6;

    transition: .35s;
}

.hair::before,
.hair::after {

    content: "";

    position: absolute;

    width: 32px;

    height: 70px;

    background: inherit;

    top: 25px;

    border-radius: 20px;
}

.hair::before {
    left: -4px;
}

.hair::after {
    right: -4px;
}

/* =========================
   EYES
========================= */

.eye {

    position: absolute;

    width: 11px;

    height: 15px;

    border-radius: 50%;

    background: #222;

    top: 60px;

    transition: .3s;
}

.eye::after {

    content: "";

    position: absolute;

    width: 4px;

    height: 5px;

    background: white;

    border-radius: 50%;

    top: 2px;

    left: 2px;
}

.eye.left {
    left: 30px;
}

.eye.right {
    right: 30px;
}

/* =========================
   SMILE
========================= */

.smile {

    position: absolute;

    width: 30px;

    height: 13px;

    border-bottom:
        3px solid #222;

    border-radius: 50%;

    left: 45px;

    top: 87px;
}

/* =========================
   SHIRT
========================= */

.body {

    width: 155px;

    height: 155px;

    background: #806cff;

    border-radius:
        35px 35px
        20px 20px;

    margin-top: -4px;

    z-index: 3;

    transition: .35s;
}

/* =========================
   PANTS
========================= */

.legs {

    display: flex;

    gap: 20px;
}

.leg {

    width: 46px;

    height: 105px;

    background: #30354d;

    border-radius:
        0 0 18px 18px;

    transition: .35s;
}

/* =========================
   SHOES
========================= */

.shoe {

    width: 68px;

    height: 29px;

    background: white;

    border-radius: 20px;

    margin-top: -3px;

    transition: .35s;
}

/* =========================
   OPTIONS
========================= */

.options-area {

    padding: 45px;

    overflow-y: auto;
}

.options-area h1 {

    font-size: 30px;

    margin-bottom: 8px;
}

.options-area p {

    color: #777;

    margin-bottom: 25px;
}

/* =========================
   CATEGORIES
========================= */

.categories {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 25px;
}

.category {

    border: none;

    background: #f2f2f7;

    padding: 11px 16px;

    border-radius: 13px;

    cursor: pointer;

    font-weight: bold;

    transition: .2s;
}

.category:hover {

    transform: translateY(-2px);
}

.category.active {

    background: #806cff;

    color: white;
}

/* =========================
   ITEMS
========================= */

.items {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 12px;
}

.item {

    min-height: 90px;

    border:
        2px solid #eee;

    border-radius: 18px;

    background: white;

    cursor: pointer;

    font-size: 30px;

    transition: .2s;
}

.item:hover {

    transform:
        translateY(-3px);

    border-color:
        #806cff;
}

/* =========================
   SAVE
========================= */

.save-character {

    width: 100%;

    border: none;

    margin-top: 25px;

    padding: 16px;

    border-radius: 16px;

    background: #806cff;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.save-character:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(128,108,255,.25);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px) {

    body {
        overflow: auto;
    }

    #customizeScreen {
        padding: 15px;
    }

    .customize {

        height: auto;

        grid-template-columns:
            1fr;
    }

    .options-area {
        padding: 25px;
    }

    .character {
        transform: scale(.85);
    }
}

</style>

</head>

<body class="neutral">

<!-- ==================================================
     LOGIN SCREEN
================================================== -->

<div id="loginScreen">

<div class="container">

<div class="login-card">

<div class="logo">
📚 Study Quest
</div>

<div class="subtitle">
Start your study journey
</div>

<!-- LANGUAGE -->

<div class="language-title">
🌍 Language
</div>

<div class="languages">

<button
class="language active"
id="englishBtn"
onclick="setLanguage('en')">

🇬🇧 English

</button>

<button
class="language"
id="arabicBtn"
onclick="setLanguage('ar')">

🇪🇬 العربية

</button>

</div>

<!-- NAME -->

<div class="input-group">

<label id="nameLabel">
👤 Name
</label>

<input
id="name"
type="text"
placeholder="Enter your name">

</div>

<!-- AGE -->

<div class="input-group">

<label id="ageLabel">
🎂 Age
</label>

<input
id="age"
type="number"
min="5"
max="25"
placeholder="Enter your age">

</div>

<!-- SCHOOL -->

<div class="input-group">

<label id="schoolLabel">
🎓 School year
</label>

<select id="school">

<option value="">
Select your school year
</option>

<option>Primary 1</option>
<option>Primary 2</option>
<option>Primary 3</option>
<option>Primary 4</option>
<option>Primary 5</option>
<option>Primary 6</option>

<option>Preparatory 1</option>
<option>Preparatory 2</option>
<option>Preparatory 3</option>

<option>Secondary 1</option>
<option>Secondary 2</option>
<option>Secondary 3</option>

</select>

</div>

<!-- GENDER -->

<div
class="gender-title"
id="genderTitle">

👤 Choose your character type

</div>

<div class="gender-buttons">

<button
class="gender"
id="girlBtn"
onclick="chooseGender('girl')">

👧 Girl

</button>

<button
class="gender"
id="boyBtn"
onclick="chooseGender('boy')">

👦 Boy

</button>

</div>

<button
class="continue"
onclick="continueApp()">

Continue →

</button>

</div>
</div>

</div>

<!-- ==================================================
     CUSTOMIZE SCREEN
================================================== -->

<div id="customizeScreen">

<div class="customize">

<!-- CHARACTER -->

<div class="character-area">

<div class="character-title">
✨ Your Character
</div>

<div class="character">

<div class="head">

<div
class="hair"
id="hair">
</div>

<div class="eye left"></div>
<div class="eye right"></div>

<div class="smile"></div>

</div>

<div
class="body"
id="shirt">
</div>

<div class="legs">

<div
class="leg"
id="pants1">
</div>

<div
class="leg"
id="pants2">
</div>

</div>

<div class="legs">

<div
class="shoe"
id="shoe1">
</div>

<div
class="shoe"
id="shoe2">
</div>

</div>

</div>

</div>

<!-- OPTIONS -->

<div class="options-area">

<h1>
Customize Character
</h1>

<p>
Create your own study character ✨
</p>

<div class="categories">

<button
class="category active"
onclick="showCategory('hair', this)">

💇 Hair

</button>

<button
class="category"
onclick="showCategory('clothes', this)">

👕 Clothes

</button>

<button
class="category"
onclick="showCategory('pants', this)">

👖 Pants

</button>

<button
class="category"
onclick="showCategory('shoes', this)">

👟 Shoes

</button>

</div>

<div
class="items"
id="items">
</div>

<button
class="save-character"
onclick="saveCharacter()">

Save Character ✨

</button>

</div>

</div>

</div>

<script>

/* =========================
   VARIABLES
========================= */

let language = "en";

let gender = "";

let currentCategory = "hair";


/* =========================
   LANGUAGE
========================= */

function setLanguage(lang) {

    language = lang;

    document
    .getElementById("englishBtn")
    .classList
    .toggle(
        "active",
        lang === "en"
    );

    document
    .getElementById("arabicBtn")
    .classList
    .toggle(
        "active",
        lang === "ar"
    );


    if(lang === "ar") {

        document.documentElement.lang = "ar";

        document.documentElement.dir = "rtl";

        document
        .querySelector(".subtitle")
        .textContent =
        "ابدأ رحلتك الدراسية";

        document
        .querySelector(".language-title")
        .textContent =
        "🌍 اللغة";

        document
        .getElementById("nameLabel")
        .textContent =
        "👤 الاسم";

        document
        .getElementById("ageLabel")
        .textContent =
        "🎂 السن";

        document
        .getElementById("schoolLabel")
        .textContent =
        "🎓 السنة الدراسية";

        document
        .getElementById("genderTitle")
        .textContent =
        "👤 اختار نوع شخصيتك";

        document
        .getElementById("name")
        .placeholder =
        "اكتب اسمك";

        document
        .getElementById("age")
        .placeholder =
        "اكتب سنك";

        document
        .querySelector(".continue")
        .textContent =
        "متابعة ←";

    }

    else {

        document.documentElement.lang = "en";

        document.documentElement.dir = "ltr";

        document
        .querySelector(".subtitle")
        .textContent =
        "Start your study journey";

        document
        .querySelector(".language-title")
        .textContent =
        "🌍 Language";

        document
        .getElementById("nameLabel")
        .textContent =
        "👤 Name";

        document
        .getElementById("ageLabel")
        .textContent =
        "🎂 Age";

        document
        .getElementById("schoolLabel")
        .textContent =
        "🎓 School year";

        document
        .getElementById("genderTitle")
        .textContent =
        "👤 Choose your character type";

        document
        .getElementById("name")
        .placeholder =
        "Enter your name";

        document
        .getElementById("age")
        .placeholder =
        "Enter your age";

        document
        .querySelector(".continue")
        .textContent =
        "Continue →";
    }
}


/* =========================
   GENDER
========================= */

function chooseGender(type) {

    gender = type;

    document
    .getElementById("girlBtn")
    .classList
    .remove("selected");

    document
    .getElementById("boyBtn")
    .classList
    .remove("selected");


    if(type === "girl") {

        document
        .getElementById("girlBtn")
        .classList
        .add(
            "selected",
            "girl"
        );

        document.body.className = "girl";

    }

    else {

        document
        .getElementById("boyBtn")
        .classList
        .add(
            "selected",
            "boy"
        );

        document.body.className = "boy";
    }
}


/* =========================
   CONTINUE
========================= */

function continueApp() {

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const age =
        document
        .getElementById("age")
        .value;

    const school =
        document
        .getElementById("school")
        .value;


    if(
        !name ||
        !age ||
        !school ||
        !gender
    ) {

        alert(
            language === "ar"
            ? "من فضلك كمّل كل البيانات ❤️"
            : "Please complete all the information ❤️"
        );

        return;
    }


    localStorage.setItem(
        "studyQuestName",
        name
    );

    localStorage.setItem(
        "studyQuestAge",
        age
    );

    localStorage.setItem(
        "studyQuestSchool",
        school
    );

    localStorage.setItem(
        "studyQuestGender",
        gender
    );

    localStorage.setItem(
        "studyQuestLanguage",
        language
    );


    document
    .getElementById("loginScreen")
    .style.display = "none";

    document
    .getElementById("customizeScreen")
    .style.display = "block";
}


/* =========================
   CATEGORIES
========================= */

function showCategory(category, button) {

    currentCategory = category;


    document
    .querySelectorAll(".category")
    .forEach(
        item =>
        item.classList.remove("active")
    );


    button.classList.add("active");


    const items =
        document.getElementById("items");


    items.innerHTML = "";


    if(category === "hair") {

        items.innerHTML = `

        <button
        class="item"
        onclick="changeHair('#4b3428')">
        🤎
        </button>

        <button
        class="item"
        onclick="changeHair('#222222')">
        🖤
        </button>

        <button
        class="item"
        onclick="changeHair('#d49b52')">
        💛
        </button>

        `;
    }


    if(category === "clothes") {

        items.innerHTML = `

        <button
        class="item"
        onclick="changeShirt('#806cff')">
        💜
        </button>

        <button
        class="item"
        onclick="changeShirt('#ff72ae')">
        🩷
        </button>

        <button
        class="item"
        onclick="changeShirt('#4d9cff')">
        💙
        </button>

        `;
    }


    if(category === "pants") {

        items.innerHTML = `

        <button
        class="item"
        onclick="changePants('#30354d')">
        🖤
        </button>

        <button
        class="item"
        onclick="changePants('#496c9e')">
        💙
        </button>

        <button
        class="item"
        onclick="changePants('#754c36')">
        🤎
        </button>

        `;
    }


    if(category === "shoes") {

        items.innerHTML = `

        <button
        class="item"
        onclick="changeShoes('#ffffff')">
        🤍
        </button>

        <button
        class="item"
        onclick="changeShoes('#222222')">
        🖤
        </button>

        <button
        class="item"
        onclick="changeShoes('#ff72ae')">
        🩷
        </button>

        `;
    }
}


/* =========================
   HAIR
========================= */

function changeHair(color) {

    document
    .getElementById("hair")
    .style
    .background = color;
}


/* =========================
   SHIRT
========================= */

function changeShirt(color) {

    document
    .getElementById("shirt")
    .style
    .background = color;
}


/* =========================
   PANTS
========================= */

function changePants(color) {

    document
    .getElementById("pants1")
    .style
    .background = color;

    document
    .getElementById("pants2")
    .style
    .background = color;
}


/* =========================
   SHOES
========================= */

function changeShoes(color) {

    document
    .getElementById("shoe1")
    .style
    .background = color;

    document
    .getElementById("shoe2")
    .style
    .background = color;
}


/* =========================
   SAVE
========================= */

function saveCharacter() {

    localStorage.setItem(
        "studyQuestCharacterSaved",
        "true"
    );


    alert(
        language === "ar"
        ? "تم حفظ شخصيتك ✨"
        : "Your character has been saved ✨"
    );
}


/* =========================
   FIRST CATEGORY
========================= */

const firstCategory =
    document.querySelector(".category");

showCategory(
    "hair",
    firstCategory
);

</script>

</body>
</html>
