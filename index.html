<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Study Quest - Avatar Creator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#f8e9ff,#e8f3ff);
    color:#29243a;
}

.app{
    width:min(1200px,94%);
    min-height:90vh;
    margin:5vh auto;
    background:rgba(255,255,255,.88);
    border-radius:35px;
    overflow:hidden;
    display:grid;
    grid-template-columns:48% 52%;
    box-shadow:0 25px 80px rgba(60,40,100,.15);
}

/* ================= AVATAR ================= */

.preview{
    position:relative;
    min-height:800px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,#fff 0%,#f9f2ff 45%,#eee7ff 100%);
}

.preview h2{
    position:absolute;
    top:30px;
    font-size:28px;
}

.avatar-box{
    width:380px;
    height:650px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

/*
   كل العناصر دي Layers.
   لما نضيف ملفات PNG حقيقية،
   كل صورة هتتحط في مكانها.
*/

.layer{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

.base{
    z-index:1;
}

.face{
    z-index:2;
}

.hair{
    z-index:3;
}

.clothes{
    z-index:4;
}

.pants{
    z-index:5;
}

.shoes{
    z-index:6;
}

.accessories{
    z-index:7;
}

/* الصورة الحالية كمرجع */

.reference{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:20px;
}

/* زر القلم */

.edit-btn{
    position:absolute;
    left:25px;
    top:50%;
    transform:translateY(-50%);
    width:58px;
    height:58px;
    border:0;
    border-radius:19px;
    background:#fff;
    box-shadow:0 10px 30px rgba(0,0,0,.13);
    font-size:25px;
    cursor:pointer;
    transition:.2s;
    z-index:20;
}

.edit-btn:hover{
    transform:translateY(-50%) scale(1.08);
}

/* ================= CONTROLS ================= */

.controls{
    padding:45px;
    overflow-y:auto;
}

.controls h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    color:#85818d;
    margin-bottom:28px;
}

.gender{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:25px;
}

.gender button{
    border:2px solid #eee;
    background:#fff;
    border-radius:18px;
    padding:17px;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.gender button:hover{
    transform:translateY(-2px);
}

.gender .selected.girl{
    border-color:#ff77b5;
    background:#fff0f7;
}

.gender .selected.boy{
    border-color:#579dff;
    background:#eef7ff;
}

.categories{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:25px;
}

.category{
    border:0;
    padding:12px 16px;
    border-radius:14px;
    background:#f1eff7;
    cursor:pointer;
    font-weight:bold;
}

.category.active{
    background:#806cff;
    color:white;
}

.options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.option{
    min-height:105px;
    border:2px solid #eee;
    background:white;
    border-radius:18px;
    cursor:pointer;
    font-size:27px;
    transition:.2s;
}

.option:hover{
    transform:translateY(-3px);
    border-color:#806cff;
}

.option.selected{
    border-color:#806cff;
    background:#f5f2ff;
}

.option small{
    display:block;
    margin-top:7px;
    font-size:12px;
}

/* ================= COLOR PANEL ================= */

.color-panel{
    position:absolute;
    left:95px;
    top:50%;
    transform:translateY(-50%);
    width:210px;
    padding:18px;
    border-radius:22px;
    background:white;
    box-shadow:0 15px 45px rgba(0,0,0,.15);
    display:none;
    z-index:50;
}

.color-panel.open{
    display:block;
}

.color-panel h3{
    margin-bottom:15px;
}

.color-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:12px 0;
}

.color-row input{
    width:50px;
    height:35px;
    border:0;
    padding:0;
    background:none;
    cursor:pointer;
}

.save{
    width:100%;
    margin-top:25px;
    padding:17px;
    border:0;
    border-radius:16px;
    background:#806cff;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.save:hover{
    box-shadow:0 10px 25px rgba(128,108,255,.3);
}

/* ================= MOBILE ================= */

@media(max-width:850px){

    .app{
        grid-template-columns:1fr;
        margin:15px auto;
    }

    .preview{
        min-height:650px;
    }

    .avatar-box{
        width:320px;
        height:560px;
    }

    .controls{
        padding:25px;
    }

    .edit-btn{
        left:12px;
    }

    .color-panel{
        left:75px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ================= PREVIEW ================= -->

    <section class="preview">

        <h2>✨ شخصيتك</h2>

        <button class="edit-btn" onclick="toggleColors()">
            ✏️
        </button>

        <div class="color-panel" id="colorPanel">

            <h3>🎨 الألوان</h3>

            <div class="color-row">
                <span>الشعر</span>
                <input
                    type="color"
                    value="#75452f"
                    onchange="setColor('hair',this.value)">
            </div>

            <div class="color-row">
                <span>الملابس</span>
                <input
                    type="color"
                    value="#f3a9c1"
                    onchange="setColor('clothes',this.value)">
            </div>

            <div class="color-row">
                <span>البنطلون</span>
                <input
                    type="color"
                    value="#6684a9"
                    onchange="setColor('pants',this.value)">
            </div>

            <div class="color-row">
                <span>الحذاء</span>
                <input
                    type="color"
                    value="#ffffff"
                    onchange="setColor('shoes',this.value)">
            </div>

        </div>

        <div class="avatar-box">

            <!-- الصورة المرجعية -->
            <img
                src="avatar-base.jpg"
                class="reference"
                id="reference">

            <!-- Layers مستقبلية -->
            <img class="layer base" id="baseLayer">
            <img class="layer face" id="faceLayer">
            <img class="layer hair" id="hairLayer">
            <img class="layer clothes" id="clothesLayer">
            <img class="layer pants" id="pantsLayer">
            <img class="layer shoes" id="shoesLayer">
            <img class="layer accessories" id="accessoriesLayer">

        </div>

    </section>


    <!-- ================= CONTROLS ================= -->

    <section class="controls">

        <h1>اصنعي شخصيتك ✨</h1>

        <p class="subtitle">
            اختاري كل جزء من شخصيتك بنفسك
        </p>


        <!-- GENDER -->

        <h3>👤 الشخصية</h3>

        <div class="gender">

            <button
                id="girl"
                onclick="chooseGender('girl')">

                👧
                <br>
                بنت

            </button>

            <button
                id="boy"
                onclick="chooseGender('boy')">

                👦
                <br>
                ولد

            </button>

        </div>


        <!-- CATEGORIES -->

        <div class="categories">

            <button
                class="category active"
                onclick="showCategory('hair',this)">
                💇 الشعر
            </button>

            <button
                class="category"
                onclick="showCategory('face',this)">
                😊 الوجه
            </button>

            <button
                class="category"
                onclick="showCategory('clothes',this)">
                👕 الملابس
            </button>

            <button
                class="category"
                onclick="showCategory('pants',this)">
                👖 البنطلون
            </button>

            <button
                class="category"
                onclick="showCategory('shoes',this)">
                👟 الحذاء
            </button>

            <button
                class="category"
                onclick="showCategory('accessories',this)">
                🎒 الإكسسوارات
            </button>

        </div>


        <div class="options" id="options"></div>


        <button class="save" onclick="saveAvatar()">
            💾 حفظ الشخصية
        </button>

    </section>

</div>


<script>

/* =========================
DATA
========================= */

let avatar = {

    gender:"girl",

    hair:"ponytail",

    face:"normal",

    clothes:"hoodie",

    pants:"jeans",

    shoes:"sneakers",

    accessory:"none"

};


/* =========================
GENDER
========================= */

function chooseGender(type){

    avatar.gender = type;

    document
        .getElementById("girl")
        .classList
        .remove("selected","girl");

    document
        .getElementById("boy")
        .classList
        .remove("selected","boy");

    if(type === "girl"){

        document
            .getElementById("girl")
            .classList
            .add("selected","girl");

    }else{

        document
            .getElementById("boy")
            .classList
            .add("selected","boy");

    }

    /*
      هنا بعدين نغير Layers
      الخاصة بالولد أو البنت.
    */
}


/* =========================
CATEGORY
========================= */

function showCategory(category,button){

    document
        .querySelectorAll(".category")
        .forEach(b =>
            b.classList.remove("active")
        );

    button.classList.add("active");

    const options =
        document.getElementById("options");

    options.innerHTML = "";


    if(category === "hair"){

        addOption("💇‍♀️","Ponytail","hair","ponytail");
        addOption("💇","Long","hair","long");
        addOption("💇‍♀️","Short","hair","short");
        addOption("🌀","Curly","hair","curly");
        addOption("👱‍♀️","Bun","hair","bun");
        addOption("🌊","Wavy","hair","wavy");

    }


    if(category === "face"){

        addOption("😊","Normal","face","normal");
        addOption("😄","Happy","face","happy");
        addOption("😌","Calm","face","calm");
        addOption("😎","Cool","face","cool");

    }


    if(category === "clothes"){

        addOption("🩷","Hoodie","clothes","hoodie");
        addOption("👕","T-Shirt","clothes","shirt");
        addOption("🧥","Jacket","clothes","jacket");
        addOption("🎓","School","clothes","school");
        addOption("🏃","Sport","clothes","sport");
        addOption("🎮","Gaming","clothes","gaming");

    }


    if(category === "pants"){

        addOption("👖","Jeans","pants","jeans");
        addOption("🩳","Shorts","pants","shorts");
        addOption("👖","Cargo","pants","cargo");

    }


    if(category === "shoes"){

        addOption("👟","Sneakers","shoes","sneakers");
        addOption("🥾","Boots","shoes","boots");
        addOption("👟","Pink","shoes","pink");
        addOption("👟","Blue","shoes","blue");

    }


    if(category === "accessories"){

        addOption("🎒","Backpack","accessory","backpack");
        addOption("🎧","Headphones","accessory","headphones");
        addOption("🧢","Cap","accessory","cap");
        addOption("👓","Glasses","accessory","glasses");
        addOption("⌚","Watch","accessory","watch");
        addOption("📚","Books","accessory","books");

    }

}


/* =========================
OPTIONS
========================= */

function addOption(icon,name,type,value){

    const button =
        document.createElement("button");

    button.className = "option";

    if(avatar[type] === value){
        button.classList.add("selected");
    }

    button.innerHTML = `
        ${icon}
        <br>
        <small>${name}</small>
    `;

    button.onclick = function(){

        avatar[type] = value;

        document
            .querySelectorAll(".option")
            .forEach(x =>
                x.classList.remove("selected")
            );

        button.classList.add("selected");

        updateLayers();

    };

    document
        .getElementById("options")
        .appendChild(button);
}


/* =========================
LAYERS
========================= */

function updateLayers(){

    /*
      هنا بنحدد ملفات الـLayers.

      مثال:

      assets/girl/hair/ponytail.png
      assets/girl/clothes/hoodie.png
      assets/girl/pants/jeans.png

      ولما نجهز الصور الحقيقية
      هنفعلها هنا.
    */

    const gender = avatar.gender;


    document.getElementById("hairLayer").src =
        `assets/${gender}/hair/${avatar.hair}.png`;

    document.getElementById("faceLayer").src =
        `assets/${gender}/face/${avatar.face}.png`;

    document.getElementById("clothesLayer").src =
        `assets/${gender}/clothes/${avatar.clothes}.png`;

    document.getElementById("pantsLayer").src =
        `assets/${gender}/pants/${avatar.pants}.png`;

    document.getElementById("shoesLayer").src =
        `assets/${gender}/shoes/${avatar.shoes}.png`;

    if(avatar.accessory === "none"){

        document.getElementById(
            "accessoriesLayer"
        ).src = "";

    }else{

        document.getElementById(
            "accessoriesLayer"
        ).src =
            `assets/${gender}/accessories/${avatar.accessory}.png`;

    }
}


/* =========================
COLORS
========================= */

function setColor(type,color){

    /*
      لما تكون الـPNG Layers جاهزة،
      نقدر نستخدم SVG أو filters
      لتلوين الطبقة بدون تغيير باقي الشخصية.
    */

    console.log(
        "Changing",
        type,
        "to",
        color
    );
}


/* =========================
COLOR PANEL
========================= */

function toggleColors(){

    document
        .getElementById("colorPanel")
        .classList
        .toggle("open");

}


/* =========================
SAVE
========================= */

function saveAvatar(){

    localStorage.setItem(
        "studyQuestAvatar",
        JSON.stringify(avatar)
    );

    alert("✨ تم حفظ شخصيتك بنجاح!");

}


/* =========================
START
========================= */

chooseGender("girl");

showCategory(
    "hair",
    document.querySelector(".category")
);

</script>

</body>
</html>
