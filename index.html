<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quest</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    transition:.4s;
    color:#29243d;
}

body.neutral{
    background:linear-gradient(135deg,#eef0ff,#fafaff);
}

body.girl{
    background:
        radial-gradient(circle at 15% 15%,#fff 0 5%,transparent 6%),
        linear-gradient(135deg,#ffd7e9,#e5dcff);
}

body.boy{
    background:
        radial-gradient(circle at 85% 15%,#fff 0 5%,transparent 6%),
        linear-gradient(135deg,#ccecff,#dcdcff);
}

button,input,select{
    font-family:inherit;
}

/* =========================
LOGIN
========================= */

#loginScreen{
    min-height:100vh;
}

.container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.login-card{
    width:100%;
    max-width:470px;
    padding:38px;
    border-radius:30px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(20px);
    box-shadow:0 30px 80px rgba(50,40,100,.16);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:900;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:28px;
}

.language-title,
.gender-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:10px;
}

.languages,
.gender-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.languages{
    margin-bottom:22px;
}

.language,
.gender{
    padding:14px;
    border:2px solid #eee;
    border-radius:14px;
    background:white;
    cursor:pointer;
    transition:.2s;
}

.language:hover,
.gender:hover{
    transform:translateY(-2px);
}

.language.active{
    border-color:#806cff;
    background:#f4f1ff;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

input,
select{
    width:100%;
    padding:14px;
    border:2px solid #eee;
    border-radius:13px;
    outline:none;
    font-size:15px;
    background:white;
}

input:focus,
select:focus{
    border-color:#806cff;
}

.gender-buttons{
    margin-bottom:25px;
}

.gender.selected.girl{
    border-color:#ff72ae;
    background:#fff0f7;
}

.gender.selected.boy{
    border-color:#4d9cff;
    background:#eef7ff;
}

.continue,
.save-character{
    width:100%;
    padding:16px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,#806cff,#a084ff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.continue:hover,
.save-character:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(128,108,255,.3);
}

/* =========================
CUSTOMIZE
========================= */

#customizeScreen{
    display:none;
    min-height:100vh;
    padding:25px;
}

.customize{
    max-width:1250px;
    min-height:calc(100vh - 50px);
    margin:auto;
    display:grid;
    grid-template-columns:48% 52%;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(20px);
    border-radius:34px;
    overflow:hidden;
    box-shadow:0 30px 90px rgba(50,40,100,.17);
}

/* =========================
CHARACTER AREA
========================= */

.character-area{
    position:relative;
    min-height:650px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:35px;
    background:
        radial-gradient(circle at 50% 25%,rgba(255,255,255,.8),transparent 35%);
}

.character-title{
    font-size:27px;
    font-weight:900;
    margin-bottom:12px;
}

.character-subtitle{
    color:#888;
    font-size:13px;
    margin-bottom:15px;
}

.character{
    width:310px;
    height:480px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding-top:20px;
    animation:float 3.5s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

/* floor */

.floor{
    position:absolute;
    bottom:15px;
    width:205px;
    height:34px;
    border-radius:50%;
    background:rgba(70,60,120,.13);
    filter:blur(2px);
}

/* =========================
CHARACTER HEAD
========================= */

.head{
    position:relative;
    width:132px;
    height:145px;
    background:#f2c6a5;
    border-radius:48% 48% 45% 45%;
    z-index:5;
    box-shadow:
        inset -7px -5px 0 rgba(0,0,0,.04),
        0 8px 20px rgba(50,40,40,.1);
}

/* ears */

.head::before,
.head::after{
    content:"";
    position:absolute;
    width:22px;
    height:32px;
    top:60px;
    background:#edbd9c;
    border-radius:50%;
    z-index:-1;
}

.head::before{
    left:-13px;
}

.head::after{
    right:-13px;
}

/* =========================
HAIR
========================= */

.hair{
    position:absolute;
    top:-24px;
    left:-10px;
    width:152px;
    height:92px;
    background:#493126;
    border-radius:75px 75px 35px 35px;
    z-index:8;
    transition:.3s;
    box-shadow:inset -7px -4px rgba(0,0,0,.08);
}

.hair.long::before,
.hair.long::after{
    content:"";
    position:absolute;
    top:35px;
    width:36px;
    height:125px;
    background:inherit;
    border-radius:25px;
}

.hair.long::before{
    left:0;
}

.hair.long::after{
    right:0;
}

.hair.short{
    height:68px;
    border-radius:70px 70px 25px 25px;
}

.hair.curly{
    height:95px;
    border-radius:48%;
    box-shadow:
        -15px 8px 0 #493126,
        15px 8px 0 #493126,
        -8px 23px 0 #493126,
        8px 23px 0 #493126;
}

.hair.ponytail{
    height:82px;
}

.hair.ponytail::after{
    content:"";
    position:absolute;
    width:43px;
    height:92px;
    background:inherit;
    border-radius:50%;
    right:-30px;
    top:30px;
}

.hair.bun{
    height:70px;
}

.hair.bun::after{
    content:"";
    position:absolute;
    width:58px;
    height:58px;
    background:inherit;
    border-radius:50%;
    left:47px;
    top:-39px;
}

.hair.wavy{
    height:95px;
    border-radius:50% 50% 38% 45%;
}

/* fringe */

.hair .fringe{
    position:absolute;
    width:70px;
    height:45px;
    left:8px;
    top:35px;
    background:inherit;
    border-radius:0 0 55% 45%;
}

/* =========================
FACE
========================= */

.eye{
    position:absolute;
    top:67px;
    width:15px;
    height:20px;
    background:#292431;
    border-radius:50%;
    z-index:10;
    transition:.3s;
}

.eye::before{
    content:"";
    position:absolute;
    width:5px;
    height:6px;
    background:#fff;
    border-radius:50%;
    top:3px;
    left:3px;
}

.eye.left{
    left:31px;
}

.eye.right{
    right:31px;
}

.blush{
    position:absolute;
    top:92px;
    width:22px;
    height:10px;
    background:#ef8e98;
    opacity:.35;
    border-radius:50%;
    z-index:9;
}

.blush.left{
    left:12px;
}

.blush.right{
    right:12px;
}

.nose{
    position:absolute;
    top:91px;
    left:62px;
    width:7px;
    height:6px;
    border-bottom:2px solid rgba(120,70,60,.5);
    border-radius:50%;
    z-index:10;
}

.smile{
    position:absolute;
    top:105px;
    left:49px;
    width:34px;
    height:15px;
    border-bottom:3px solid #733f48;
    border-radius:50%;
    z-index:10;
    transition:.3s;
}

/* =========================
NECK
========================= */

.neck{
    width:38px;
    height:28px;
    margin-top:-2px;
    background:#efc19f;
    z-index:4;
}

/* =========================
BODY
========================= */

.avatar-body{
    position:relative;
    width:172px;
    height:158px;
    margin-top:-3px;
    background:#806cff;
    border-radius:38px 38px 27px 27px;
    z-index:3;
    box-shadow:
        inset -8px -8px 0 rgba(0,0,0,.06),
        0 12px 20px rgba(50,40,100,.12);
    transition:.3s;
}

/* sleeves */

.avatar-body::before,
.avatar-body::after{
    content:"";
    position:absolute;
    width:42px;
    height:100px;
    top:24px;
    background:inherit;
    border-radius:25px;
}

.avatar-body::before{
    left:-30px;
    transform:rotate(8deg);
}

.avatar-body::after{
    right:-30px;
    transform:rotate(-8deg);
}

/* shirt decoration */

.shirt-logo{
    position:absolute;
    top:55px;
    left:70px;
    font-size:24px;
    z-index:4;
}

/* =========================
LEGS
========================= */

.legs{
    display:flex;
    gap:18px;
    z-index:2;
}

.leg{
    width:52px;
    height:105px;
    background:#35405c;
    border-radius:0 0 20px 20px;
    box-shadow:inset -6px -5px rgba(0,0,0,.08);
    transition:.3s;
}

/* =========================
SHOES
========================= */

.shoes{
    display:flex;
    gap:10px;
    margin-top:-3px;
    z-index:4;
}

.shoe{
    position:relative;
    width:76px;
    height:33px;
    background:#fff;
    border-radius:22px 22px 12px 12px;
    box-shadow:0 5px 0 rgba(0,0,0,.08);
    transition:.3s;
}

.shoe::after{
    content:"";
    position:absolute;
    left:15px;
    top:8px;
    width:35px;
    height:3px;
    background:rgba(0,0,0,.12);
    border-radius:10px;
}

/* =========================
ACCESSORY
========================= */

.accessory{
    position:absolute;
    z-index:15;
    display:none;
    font-size:43px;
    top:165px;
    right:25px;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.12));
}

/* =========================
PEN
========================= */

.color-edit{
    position:absolute;
    left:22px;
    top:50%;
    transform:translateY(-50%);
    width:58px;
    height:58px;
    border:0;
    border-radius:18px;
    background:white;
    box-shadow:0 10px 30px rgba(0,0,0,.13);
    font-size:25px;
    cursor:pointer;
    z-index:30;
    transition:.2s;
}

.color-edit:hover{
    transform:translateY(-50%) scale(1.06);
}

/* =========================
COLOR PANEL
========================= */

.color-panel{
    position:absolute;
    left:92px;
    top:50%;
    transform:translateY(-50%);
    width:210px;
    background:white;
    border-radius:22px;
    padding:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.16);
    display:none;
    z-index:30;
}

.color-panel.open{
    display:block;
}

.color-panel h3{
    margin-bottom:14px;
}

.color-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:11px 0;
    font-size:14px;
}

.color-row input{
    width:50px;
    height:34px;
    padding:2px;
    border:0;
}

/* =========================
OPTIONS
========================= */

.options-area{
    padding:42px;
    overflow-y:auto;
}

.options-area h1{
    font-size:31px;
    margin-bottom:7px;
}

.options-area p{
    color:#777;
    margin-bottom:22px;
}

.categories{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:24px;
}

.category{
    border:0;
    background:#f1f1f6;
    padding:11px 15px;
    border-radius:13px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.category:hover{
    transform:translateY(-2px);
}

.category.active{
    background:#806cff;
    color:#fff;
}

.items{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.item{
    min-height:100px;
    border:2px solid #eee;
    border-radius:20px;
    background:#fff;
    cursor:pointer;
    transition:.2s;
    font-size:25px;
    color:#333;
}

.item:hover{
    transform:translateY(-4px);
    border-color:#806cff;
    box-shadow:0 8px 20px rgba(80,70,150,.1);
}

.item.selected{
    border-color:#806cff;
    background:#f4f1ff;
    box-shadow:0 0 0 3px rgba(128,108,255,.1);
}

.item small{
    font-size:12px;
    display:block;
    margin-top:6px;
}

/* hair preview */

.hair-option{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.hair-preview{
    width:48px;
    height:48px;
    background:#493126;
    border-radius:50%;
    position:relative;
}

.hair-preview.long{
    height:59px;
}

.hair-preview.short{
    height:39px;
}

.hair-preview.curly{
    box-shadow:
        -7px 7px 0 #493126,
        7px 7px 0 #493126;
}

.hair-preview.ponytail::after{
    content:"";
    position:absolute;
    width:18px;
    height:35px;
    background:inherit;
    border-radius:50%;
    right:-10px;
    top:18px;
}

.hair-preview.bun::after{
    content:"";
    position:absolute;
    width:25px;
    height:25px;
    background:inherit;
    border-radius:50%;
    left:12px;
    top:-14px;
}

.hair-preview.wavy{
    border-radius:45% 55% 35% 50%;
}

/* =========================
SAVE
========================= */

.save-character{
    margin-top:25px;
}

/* =========================
MOBILE
========================= */

@media(max-width:850px){

    body{
        overflow:auto;
    }

    #customizeScreen{
        padding:10px;
    }

    .customize{
        grid-template-columns:1fr;
    }

    .character-area{
        min-height:600px;
    }

    .options-area{
        padding:25px;
    }

    .color-edit{
        left:10px;
    }

    .color-panel{
        left:75px;
    }
}

@media(max-width:500px){

    .login-card{
        padding:28px 20px;
    }

    .items{
        grid-template-columns:repeat(2,1fr);
    }

    .character{
        transform:scale(.9);
    }

    .character-area{
        min-height:560px;
    }
}
</style>
</head>

<body class="neutral">

<!-- =========================
LOGIN
========================= -->

<div id="loginScreen">

<div class="container">

<div class="login-card">

<div class="logo">📚 Study Quest</div>

<div class="subtitle">Start your study journey</div>

<div class="language-title">🌍 Language</div>

<div class="languages">

<button class="language active"
id="englishBtn"
onclick="setLanguage('en')">
🇬🇧 English
</button>

<button class="language"
id="arabicBtn"
onclick="setLanguage('ar')">
🇪🇬 العربية
</button>

</div>

<div class="input-group">

<label id="nameLabel">👤 Name</label>

<input
id="name"
type="text"
placeholder="Enter your name">

</div>

<div class="input-group">

<label id="ageLabel">🎂 Age</label>

<input
id="age"
type="number"
min="5"
max="25"
placeholder="Enter your age">

</div>

<div class="input-group">

<label id="schoolLabel">🎓 School year</label>

<select id="school">

<option value="">Select your school year</option>

<option>Primary 1</option>
<option>Primary 2</option>
<option>Primary 3</option>
<option>Primary 4</option>
<option>Primary 5</option>
<option>Primary 6</option>

<option>Preparatory 1</option>
<option>Preparatory 2</option>
<option>Preparatory 3</option>

<option>Secondary 1</option>
<option>Secondary 2</option>
<option>Secondary 3</option>

</select>

</div>

<div class="gender-title" id="genderTitle">
👤 Choose your character type
</div>

<div class="gender-buttons">

<button
class="gender"
id="girlBtn"
onclick="chooseGender('girl')">
👧 Girl
</button>

<button
class="gender"
id="boyBtn"
onclick="chooseGender('boy')">
👦 Boy
</button>

</div>

<button class="continue" onclick="continueApp()">
Continue →
</button>

</div>
</div>
</div>

<!-- =========================
CUSTOMIZE
========================= -->

<div id="customizeScreen">

<div class="customize">

<!-- CHARACTER -->

<div class="character-area">

<button class="color-edit" onclick="toggleColors()">✏️</button>

<div class="color-panel" id="colorPanel">

<h3>🎨 Colors</h3>

<div class="color-row">
<span>Hair</span>
<input
id="hairColor"
type="color"
value="#493126"
oninput="changeColor('hair',this.value)">
</div>

<div class="color-row">
<span>Outfit</span>
<input
id="shirtColor"
type="color"
value="#806cff"
oninput="changeColor('shirt',this.value)">
</div>

<div class="color-row">
<span>Pants</span>
<input
id="pantsColor"
type="color"
value="#35405c"
oninput="changeColor('pants',this.value)">
</div>

<div class="color-row">
<span>Shoes</span>
<input
id="shoesColor"
type="color"
value="#ffffff"
oninput="changeColor('shoes',this.value)">
</div>

</div>

<div class="character-title">✨ Your Character</div>

<div class="character-subtitle">
Make it yours!
</div>

<div class="character">

<div class="floor"></div>

<div class="head">

<div class="hair long" id="hair">
<div class="fringe"></div>
</div>

<div class="eye left"></div>
<div class="eye right"></div>

<div class="blush left"></div>
<div class="blush right"></div>

<div class="nose"></div>
<div class="smile"></div>

</div>

<div class="neck"></div>

<div class="avatar-body" id="shirt">
<div class="shirt-logo">★</div>
</div>

<div class="legs">

<div class="leg" id="pants1"></div>
<div class="leg" id="pants2"></div>

</div>

<div class="shoes">

<div class="shoe" id="shoe1"></div>
<div class="shoe" id="shoe2"></div>

</div>

<div class="accessory" id="accessory"></div>

</div>

</div>

<!-- OPTIONS -->

<div class="options-area">

<h1>Customize Character</h1>

<p>Create your own Study Quest character ✨</p>

<div class="categories">

<button class="category active"
onclick="showCategory('hair',this)">
💇 Hair
</button>

<button class="category"
onclick="showCategory('face',this)">
😊 Face
</button>

<button class="category"
onclick="showCategory('clothes',this)">
👕 Outfit
</button>

<button class="category"
onclick="showCategory('pants',this)">
👖 Pants
</button>

<button class="category"
onclick="showCategory('shoes',this)">
👟 Shoes
</button>

<button class="category"
onclick="showCategory('accessories',this)">
🎒 Accessories
</button>

</div>

<div class="items" id="items"></div>

<button class="save-character"
onclick="saveCharacter()">
💾 Save Character
</button>

</div>

</div>
</div>

<script>

/* =========================
DATA
========================= */

let language="en";
let gender="";

let character={
    hair:"#493126",
    shirt:"#806cff",
    pants:"#35405c",
    shoes:"#ffffff",
    hairStyle:"long",
    face:"normal",
    accessory:"none"
};


/* =========================
LANGUAGE
========================= */

function setLanguage(lang){

    language=lang;

    document
    .getElementById("englishBtn")
    .classList
    .toggle("active",lang==="en");

    document
    .getElementById("arabicBtn")
    .classList
    .toggle("active",lang==="ar");

    if(lang==="ar"){

        document.documentElement.lang="ar";
        document.documentElement.dir="rtl";

        document.querySelector(".subtitle").textContent=
            "ابدأ رحلتك الدراسية";

        document.querySelector(".language-title").textContent=
            "🌍 اللغة";

        document.getElementById("nameLabel").textContent=
            "👤 الاسم";

        document.getElementById("ageLabel").textContent=
            "🎂 السن";

        document.getElementById("schoolLabel").textContent=
            "🎓 السنة الدراسية";

        document.getElementById("genderTitle").textContent=
            "👤 اختار نوع شخصيتك";

        document.getElementById("name").placeholder=
            "اكتب اسمك";

        document.getElementById("age").placeholder=
            "اكتب سنك";

        document.querySelector(".continue").textContent=
            "متابعة ←";

    }else{

        document.documentElement.lang="en";
        document.documentElement.dir="ltr";

        document.querySelector(".subtitle").textContent=
            "Start your study journey";

        document.querySelector(".language-title").textContent=
            "🌍 Language";

        document.getElementById("nameLabel").textContent=
            "👤 Name";

        document.getElementById("ageLabel").textContent=
            "🎂 Age";

        document.getElementById("schoolLabel").textContent=
            "🎓 School year";

        document.getElementById("genderTitle").textContent=
            "👤 Choose your character type";

        document.getElementById("name").placeholder=
            "Enter your name";

        document.getElementById("age").placeholder=
            "Enter your age";

        document.querySelector(".continue").textContent=
            "Continue →";
    }
}


/* =========================
GENDER
========================= */

function chooseGender(type){

    gender=type;

    document
    .getElementById("girlBtn")
    .classList.remove("selected","girl");

    document
    .getElementById("boyBtn")
    .classList.remove("selected","boy");

    if(type==="girl"){

        document
        .getElementById("girlBtn")
        .classList.add("selected","girl");

        document.body.className="girl";

    }else{

        document
        .getElementById("boyBtn")
        .classList.add("selected","boy");

        document.body.className="boy";
    }
}


/* =========================
CONTINUE
========================= */

function continueApp(){

    const name=document.getElementById("name").value.trim();
    const age=document.getElementById("age").value;
    const school=document.getElementById("school").value;

    if(!name || !age || !school || !gender){

        alert(
            language==="ar"
            ?"من فضلك كمّل كل البيانات ❤️"
            :"Please complete all the information ❤️"
        );

        return;
    }

    localStorage.setItem("studyQuestName",name);
    localStorage.setItem("studyQuestAge",age);
    localStorage.setItem("studyQuestSchool",school);
    localStorage.setItem("studyQuestGender",gender);
    localStorage.setItem("studyQuestLanguage",language);

    document.getElementById("loginScreen").style.display="none";
    document.getElementById("customizeScreen").style.display="block";

    showCategory(
        "hair",
        document.querySelector(".category")
    );
}

/* =========================
HAIR
========================= */

function hairStyle(style,button){

    character.hairStyle=style;

    const hair=document.getElementById("hair");

    hair.className="hair";

    hair.style.height="";
    hair.style.borderRadius="";
    hair.style.boxShadow="";

    hair.classList.add(style);

    selectItem(button);
}


/* =========================
FACE
========================= */

function faceStyle(style,button){

    character.face=style;

    const eyes=document.querySelectorAll(".eye");
    const smile=document.querySelector(".smile");

    if(style==="cool"){

        eyes.forEach(e=>{
            e.style.height="8px";
        });

        smile.style.width="22px";

    }else if(style==="happy"){

        eyes.forEach(e=>{
            e.style.height="14px";
        });

        smile.style.width="40px";

    }else if(style==="calm"){

        eyes.forEach(e=>{
            e.style.height="11px";
        });

        smile.style.width="27px";

    }else{

        eyes.forEach(e=>{
            e.style.height="20px";
        });

        smile.style.width="34px";
    }

    selectItem(button);
}


/* =========================
COLORS
========================= */

function changeColor(type,color){

    character[type]=color;

    if(type==="hair"){

        document.getElementById("hair").style.background=color;
        document.getElementById("hairColor").value=color;

    }

    if(type==="shirt"){

        document.getElementById("shirt").style.background=color;
        document.getElementById("shirtColor").value=color;

    }

    if(type==="pants"){

        document.getElementById("pants1").style.background=color;
        document.getElementById("pants2").style.background=color;
        document.getElementById("pantsColor").value=color;

    }

    if(type==="shoes"){

        document.getElementById("shoe1").style.background=color;
        document.getElementById("shoe2").style.background=color;
        document.getElementById("shoesColor").value=color;

    }
}


/* =========================
ACCESSORY
========================= */

function setAccessory(item,button){

    character.accessory=item;

    const accessory=document.getElementById("accessory");

    accessory.textContent=item;
    accessory.style.display="block";

    selectItem(button);
}


/* =========================
SELECT
========================= */

function selectItem(button){

    document
    .querySelectorAll(".item")
    .forEach(b=>b.classList.remove("selected"));

    button.classList.add("selected");
}


/* =========================
COLOR PANEL
========================= */

function toggleColors(){

    document
    .getElementById("colorPanel")
    .classList
    .toggle("open");
}


/* =========================
SAVE
========================= */

function saveCharacter(){

    localStorage.setItem(
        "studyQuestCharacter",
        JSON.stringify(character)
    );

    alert(
        language==="ar"
        ?"تم حفظ شخصيتك بنجاح ✨"
        :"Your character has been saved ✨"
    );
}
