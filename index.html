<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quest</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    transition:.4s;
    overflow-x:hidden;
}

body.neutral{
    background:linear-gradient(135deg,#eef0ff,#fafaff);
}

body.girl{
    background:linear-gradient(135deg,#ffd9eb,#e9ddff);
}

body.boy{
    background:linear-gradient(135deg,#d2efff,#dddfff);
}

button{
    font-family:inherit;
}

/* =========================
LOGIN
========================= */

#loginScreen{
    min-height:100vh;
}

.container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.login-card{
    width:100%;
    max-width:470px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(18px);
    border-radius:30px;
    padding:38px;
    box-shadow:0 25px 70px rgba(50,40,100,.15);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:800;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:28px;
}

.language-title,
.gender-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:10px;
}

.languages,
.gender-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.languages{
    margin-bottom:22px;
}

.language,
.gender{
    padding:14px;
    border:2px solid #eee;
    border-radius:14px;
    background:white;
    cursor:pointer;
    transition:.2s;
}

.language.active{
    border-color:#806cff;
    background:#f4f1ff;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

input,
select{
    width:100%;
    padding:14px;
    border:2px solid #eee;
    border-radius:13px;
    outline:none;
    font-size:15px;
    background:white;
}

input:focus,
select:focus{
    border-color:#806cff;
}

.gender-buttons{
    margin-bottom:25px;
}

.gender.selected.girl{
    border-color:#ff72ae;
    background:#fff0f7;
}

.gender.selected.boy{
    border-color:#4d9cff;
    background:#eef7ff;
}

.continue{
    width:100%;
    padding:16px;
    border:none;
    border-radius:15px;
    background:#806cff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
CUSTOMIZE
========================= */

#customizeScreen{
    display:none;
    min-height:100vh;
    padding:25px;
}

.customize{
    max-width:1200px;
    min-height:calc(100vh - 50px);
    margin:auto;
    display:grid;
    grid-template-columns:45% 55%;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(20px);
    border-radius:32px;
    overflow:hidden;
    box-shadow:0 25px 80px rgba(50,40,100,.15);
}

/* =========================
CHARACTER AREA
========================= */

.character-area{
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.character-title{
    font-size:28px;
    font-weight:800;
    margin-bottom:20px;
}

.character{
    width:300px;
    height:450px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

/* floor */

.floor{
    position:absolute;
    bottom:35px;
    width:190px;
    height:30px;
    border-radius:50%;
    background:rgba(80,70,130,.12);
}

/* head */

.head{
    position:relative;
    width:125px;
    height:135px;
    background:#f1c6a5;
    border-radius:48% 48% 45% 45%;
    z-index:5;
}

/* hair */

.hair{
    position:absolute;
    top:-22px;
    left:-8px;
    width:141px;
    height:85px;
    background:#4b3428;
    border-radius:70px 70px 35px 35px;
    z-index:7;
    transition:.3s;
}

.hair.long::before,
.hair.long::after{
    content:"";
    position:absolute;
    top:35px;
    width:32px;
    height:105px;
    background:inherit;
    border-radius:20px;
}

.hair.long::before{
    left:0;
}

.hair.long::after{
    right:0;
}

/* eyes */

.eye{
    position:absolute;
    top:61px;
    width:12px;
    height:16px;
    background:#222;
    border-radius:50%;
    z-index:8;
}

.eye::after{
    content:"";
    position:absolute;
    width:4px;
    height:5px;
    background:white;
    border-radius:50%;
    top:2px;
    left:2px;
}

.eye.left{
    left:30px;
}

.eye.right{
    right:30px;
}

/* smile */

.smile{
    position:absolute;
    top:91px;
    left:47px;
    width:31px;
    height:13px;
    border-bottom:3px solid #333;
    border-radius:50%;
    z-index:8;
}

/* body */

.avatar-body{
    position:relative;
    width:155px;
    height:145px;
    background:#806cff;
    border-radius:35px 35px 22px 22px;
    z-index:3;
    margin-top:-2px;
    transition:.3s;
}

/* arms */

.avatar-body::before,
.avatar-body::after{
    content:"";
    position:absolute;
    width:35px;
    height:105px;
    top:20px;
    background:inherit;
    border-radius:20px;
}

.avatar-body::before{
    left:-25px;
    transform:rotate(8deg);
}

.avatar-body::after{
    right:-25px;
    transform:rotate(-8deg);
}

/* legs */

.legs{
    display:flex;
    gap:17px;
    z-index:2;
}

.leg{
    width:48px;
    height:100px;
    background:#35405c;
    border-radius:0 0 18px 18px;
    transition:.3s;
}

/* shoes */

.shoes{
    display:flex;
    gap:8px;
    margin-top:-4px;
    z-index:4;
}

.shoe{
    width:70px;
    height:30px;
    background:white;
    border-radius:20px;
    transition:.3s;
}

/* accessory */

.accessory{
    position:absolute;
    z-index:10;
    font-size:42px;
    top:115px;
    right:45px;
    display:none;
}

/* =========================
EDIT COLOR BUTTON
========================= */

.color-edit{
    position:absolute;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    width:52px;
    height:52px;
    border:none;
    border-radius:17px;
    background:white;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    font-size:24px;
    cursor:pointer;
    z-index:20;
}

/* =========================
COLOR PANEL
========================= */

.color-panel{
    position:absolute;
    left:85px;
    top:50%;
    transform:translateY(-50%);
    width:190px;
    background:white;
    border-radius:20px;
    padding:17px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    display:none;
    z-index:30;
}

.color-panel.open{
    display:block;
}

.color-panel h3{
    margin-bottom:13px;
}

.color-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:10px 0;
    font-size:14px;
}

.color-row input{
    width:48px;
    height:35px;
    padding:2px;
    border:none;
}

/* =========================
OPTIONS
========================= */

.options-area{
    padding:40px;
    overflow-y:auto;
}

.options-area h1{
    font-size:30px;
    margin-bottom:7px;
}

.options-area p{
    color:#777;
    margin-bottom:22px;
}

.categories{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:22px;
}

.category{
    border:none;
    background:#f1f1f6;
    padding:11px 15px;
    border-radius:13px;
    cursor:pointer;
    font-weight:bold;
}

.category.active{
    background:#806cff;
    color:white;
}

.items{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.item{
    min-height:90px;
    border:2px solid #eee;
    border-radius:18px;
    background:white;
    cursor:pointer;
    transition:.2s;
    font-size:25px;
}

.item:hover{
    transform:translateY(-3px);
    border-color:#806cff;
}

.item.selected{
    border-color:#806cff;
    background:#f4f1ff;
}

.save-character{
    width:100%;
    margin-top:25px;
    padding:16px;
    border:none;
    border-radius:15px;
    background:#806cff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
/* =========================
HAIR PREVIEWS
========================= */

.hair-option{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.hair-option small{
    font-size:12px;
    color:#666;
}

.preview-hair{
    width:48px;
    height:48px;
    display:block;
    position:relative;
    background:#4b3428;
    border-radius:50% 50% 35% 35%;
}

/* Long */

.long-preview{
    height:55px;
}

.long-preview::before,
.long-preview::after{
    content:"";
    position:absolute;
    width:12px;
    height:35px;
    background:inherit;
    top:25px;
    border-radius:10px;
}

.long-preview::before{
    left:2px;
}

.long-preview::after{
    right:2px;
}

/* Short */

.short-preview{
    height:38px;
    border-radius:50% 50% 25% 25%;
}

/* Curly */

.curly-preview{
    border-radius:45%;
    box-shadow:
        -8px 8px 0 #4b3428,
        8px 8px 0 #4b3428,
        0 13px 0 #4b3428;
}

/* Ponytail */

.ponytail-preview::after{
    content:"";
    position:absolute;
    width:20px;
    height:38px;
    background:inherit;
    border-radius:50%;
    right:-12px;
    top:18px;
}

/* Bun */

.bun-preview::after{
    content:"";
    position:absolute;
    width:24px;
    height:24px;
    background:inherit;
    border-radius:50%;
    top:-15px;
    left:12px;
}

/* Wavy */

.wavy-preview{
    border-radius:
        45% 55% 40% 50%;
    height:52px;
}
/* =========================
MOBILE
========================= */

@media(max-width:850px){

    body{
        overflow:auto;
    }

    #customizeScreen{
        padding:12px;
    }

    .customize{
        grid-template-columns:1fr;
    }

    .character-area{
        min-height:500px;
    }

    .options-area{
        padding:25px;
    }

    .color-edit{
        left:10px;
    }

    .color-panel{
        left:70px;
    }
}

</style>

</head>

<body class="neutral">

<!-- =================================================
LOGIN
================================================= -->

<div id="loginScreen">

<div class="login-card">

<div class="logo">

</div>

</div>

id="englishBtn"

id="arabicBtn"

CUSTOMIZE
================================================= -->

<div class="customize">

<!-- CHARACTER -->

<div class="character-area">

class="color-edit"
onclick="toggleColors()">

✏️

</button>

<div
class="color-panel"
id="colorPanel">

<h3>🎨 Colors</h3>

<div class="color-row">

<span>Hair</span>

<input
type="color"
value="#4b3428"
oninput="changeColor('hair',this.value)">

</div>

<div class="color-row">

<span>Outfit</span>

<input
type="color"
value="#806cff"
oninput="changeColor('shirt',this.value)">

</div>

<div class="color-row">

<span>Pants</span>

<input
type="color"
value="#35405c"
oninput="changeColor('pants',this.value)">

</div>

<div class="color-row">

<span>Shoes</span>

<input
type="color"
value="#ffffff"
oninput="changeColor('shoes',this.value)">

</div>

</div>

<div class="character-title">
✨ Your Character
</div>

<div class="character">

<div class="floor"></div>

<div class="head">

<div
class="hair long"
id="hair">
</div>

<div class="eye left"></div>

<div class="eye right"></div>

<div class="smile"></div>

</div>

<div
class="avatar-body"
id="shirt">
</div>

<div class="legs">

<div
class="leg"
id="pants1">
</div>

<div
class="leg"
id="pants2">
</div>

</div>

<div class="shoes">

<div
class="shoe"
id="shoe1">
</div>

<div
class="shoe"
id="shoe2">
</div>

</div>

<div
class="accessory"
id="accessory">
</div>

</div>

</div>

<!-- OPTIONS -->

<div class="options-area">

<h1>
Customize Character
</h1>

<p>
Create your own Study Quest character ✨
</p>

<div class="categories">

<button
class="category active"
onclick="showCategory('hair',this)">

💇 Hair

</button>

<button
class="category"
onclick="showCategory('face',this)">

😊 Face

</button>

<button
class="category"
onclick="showCategory('clothes',this)">

👕 Outfit

</button>

<button
class="category"
onclick="showCategory('pants',this)">

👖 Pants

</button>

<button
class="category"
onclick="showCategory('shoes',this)">

👟 Shoes

</button>

<button
class="category"
onclick="showCategory('accessories',this)">

🎒 Accessories

</button>

</div>

class="items"
id="items">
</div>

class="save-character"
onclick="saveCharacter()">

💾 Save Character

</button>

</div>

</div>

</div>

<script>

/* =========================
VARIABLES
========================= */

let language = "en";

let gender = "";

let currentCategory = "hair";


let character = {

hair:"#4b3428",

shirt:"#806cff",

pants:"#35405c",

shoes:"#ffffff",

hairStyle:"long",

face:"normal",

accessory:"none"

};


/* =========================
LANGUAGE
========================= */

function setLanguage(lang){

language=lang;

document
.getElementById("englishBtn")
.classList
.toggle("active",lang==="en");

document
.getElementById("arabicBtn")
.classList
.toggle("active",lang==="ar");

if(lang==="ar"){

document.documentElement.lang="ar";

document.documentElement.dir="rtl";

document.querySelector(".subtitle")
.textContent="ابدأ رحلتك الدراسية";

document.querySelector(".language-title")
.textContent="🌍 اللغة";

document.getElementById("nameLabel")
.textContent="👤 الاسم";

document.getElementById("ageLabel")
.textContent="🎂 السن";

document.getElementById("schoolLabel")
.textContent="🎓 السنة الدراسية";

document.getElementById("genderTitle")
.textContent="👤 اختار نوع شخصيتك";

document.getElementById("name")
.placeholder="اكتب اسمك";

document.getElementById("age")
.placeholder="اكتب سنك";

document.querySelector(".continue")
.textContent="متابعة ←";

}else{

document.documentElement.lang="en";

document.documentElement.dir="ltr";

document.querySelector(".subtitle")
.textContent="Start your study journey";

document.querySelector(".language-title")
.textContent="🌍 Language";

document.getElementById("nameLabel")
.textContent="👤 Name";

document.getElementById("ageLabel")
.textContent="🎂 Age";

document.getElementById("schoolLabel")
.textContent="🎓 School year";

document.getElementById("genderTitle")
.textContent="👤 Choose your character type";

document.getElementById("name")
.placeholder="Enter your name";

document.getElementById("age")
.placeholder="Enter your age";

document.querySelector(".continue")
.textContent="Continue →";

}

}


/* =========================
GENDER
========================= */

function chooseGender(type){

gender=type;

document
.getElementById("girlBtn")
.classList.remove("selected");

document
.getElementById("boyBtn")
.classList.remove("selected");


if(type==="girl"){

document
.getElementById("girlBtn")
.classList.add("selected","girl");

document.body.className="girl";

}else{

document
.getElementById("boyBtn")
.classList.add("selected","boy");

document.body.className="boy";

}

}


/* =========================
CONTINUE
========================= */

function continueApp(){

const name=document
.getElementById("name")
.value
.trim();

const age=document
.getElementById("age")
.value;

const school=document
.getElementById("school")
.value;


if(!name || !age || !school || !gender){

alert(
language==="ar"
?"من فضلك كمّل كل البيانات ❤️"
:"Please complete all the information ❤️"
);

return;
}


localStorage.setItem(
"studyQuestName",
name
);

localStorage.setItem(
"studyQuestAge",
age
);

localStorage.setItem(
"studyQuestSchool",
school
);

localStorage.setItem(
"studyQuestGender",
gender
);

localStorage.setItem(
"studyQuestLanguage",
language
);


document.getElementById("loginScreen")
.style.display="none";

document.getElementById("customizeScreen")
.style.display="block";


showCategory(
"hair",
document.querySelector(".category")
);

}


/* =========================
CATEGORY
========================= */

function showCategory(category,button){

currentCategory=category;


document
.querySelectorAll(".category")
.forEach(
b=>b.classList.remove("active")
);

button.classList.add("active");


const items=document
.getElementById("items");

items.innerHTML="";


if(category==="hair"){

items.innerHTML=`

<button class="item hair-option" onclick="hairStyle('long',this)">
    <span class="preview-hair long-preview"></span>
    <small>Long</small>
</button>

<button class="item hair-option" onclick="hairStyle('short',this)">
    <span class="preview-hair short-preview"></span>
    <small>Short</small>
</button>

<button class="item hair-option" onclick="hairStyle('curly',this)">
    <span class="preview-hair curly-preview"></span>
    <small>Curly</small>
</button>

<button class="item hair-option" onclick="hairStyle('ponytail',this)">
    <span class="preview-hair ponytail-preview"></span>
    <small>Ponytail</small>
</button>

<button class="item hair-option" onclick="hairStyle('bun',this)">
    <span class="preview-hair bun-preview"></span>
    <small>Bun</small>
</button>

<button class="item hair-option" onclick="hairStyle('wavy',this)">
    <span class="preview-hair wavy-preview"></span>
    <small>Wavy</small>
</button>

`;




if(category==="face"){

items.innerHTML=`

<button class="item" onclick="faceStyle('normal',this)">
😊
</button>

<button class="item" onclick="faceStyle('happy',this)">
😄
</button>

<button class="item" onclick="faceStyle('calm',this)">
😌
</button>

<button class="item" onclick="faceStyle('cool',this)">
😎
</button>

`;

}


if(category==="clothes"){

items.innerHTML=`

<button class="item" onclick="changeColor('shirt','#806cff');selectItem(this)">
👕
</button>

<button class="item" onclick="changeColor('shirt','#ff72ae');selectItem(this)">
👚
</button>

<button class="item" onclick="changeColor('shirt','#4d9cff');selectItem(this)">
🧥
</button>

<button class="item" onclick="changeColor('shirt','#54b88b');selectItem(this)">
🧶
</button>

<button class="item" onclick="changeColor('shirt','#f0a64b');selectItem(this)">
🏃
</button>

<button class="item" onclick="changeColor('shirt','#444');selectItem(this)">
🎮
</button>

`;

}


if(category==="pants"){

items.innerHTML=`

<button class="item" onclick="changeColor('pants','#35405c');selectItem(this)">
👖
</button>

<button class="item" onclick="changeColor('pants','#496c9e');selectItem(this)">
🩳
</button>

<button class="item" onclick="changeColor('pants','#754c36');selectItem(this)">
🤎
</button>

`;

}


if(category==="shoes"){

items.innerHTML=`

<button class="item" onclick="changeColor('shoes','#ffffff');selectItem(this)">
👟
</button>

<button class="item" onclick="changeColor('shoes','#222222');selectItem(this)">
🥾
</button>

<button class="item" onclick="changeColor('shoes','#ff72ae');selectItem(this)">
👟
</button>

`;

}


if(category==="accessories"){

items.innerHTML=`

<button class="item" onclick="setAccessory('🎒',this)">

/* =========================
HAIR
========================= */

function hairStyle(style,button){

character.hairStyle=style;

const hair=document
.getElementById("hair");

hair.className="hair";


if(style==="long"){

hair.classList.add("long");

}

if(style==="short"){

hair.style.height="55px";

hair.style.borderRadius="60px 60px 25px 25px";

}

if(style==="curly"){

hair.style.borderRadius="45%";

hair.style.height="90px";

}

if(style==="ponytail"){

hair.style.borderRadius="70px 70px 30px 30px";

}

if(style==="bun"){

hair.style.height="65px";

hair.style.borderRadius="50%";

}

if(style==="wavy"){

hair.style.borderRadius="45% 55% 35% 50%";

hair.style.height="92px";

}


selectItem(button);

}


/* =========================
FACE
========================= */

function faceStyle(style,button){

character.face=style;

const eyes=document
.querySelectorAll(".eye");

const smile=document
.querySelector(".smile");


if(style==="cool"){

eyes.forEach(
e=>e.style.height="7px"
);

smile.style.width="20px";

}

else if(style==="happy"){

eyes.forEach(
e=>e.style.height="13px"
);

smile.style.width="38px";

}

else if(style==="calm"){

eyes.forEach(
e=>e.style.height="10px"
);

smile.style.width="25px";

}

else{

eyes.forEach(
e=>e.style.height="16px"
);

smile.style.width="31px";

}

selectItem(button);

}

function changeColor(type,color){

character[type]=color;


if(type==="hair"){

document
.getElementById("hair")
.style.background=color;

}

if(type==="shirt"){

document
.getElementById("shirt")
.style.background=color;

}

if(type==="pants"){

document
.getElementById("pants1")
.style.background=color;

document
.getElementById("pants2")
.style.background=color;

}

if(type==="shoes"){

document
.getElementById("shoe1")
.style.background=color;

document
.getElementById("shoe2")
.style.background=color;

}

}


/* =========================
ACCESSORIES
========================= */

function setAccessory(item,button){

character.accessory=item;

const accessory=document
.getElementById("accessory");

accessory.textContent=item;

accessory.style.display="block";

selectItem(button);

}


/* =========================
SELECT ITEM
========================= */

function selectItem(button){

document
.querySelectorAll(".item")
.forEach(
b=>b.classList.remove("selected")
);

button.classList.add("selected");

}


/* =========================
COLOR PANEL
========================= */

function toggleColors(){

document
.getElementById("colorPanel")
.classList.toggle("open");

}

SAVE
========================= */

function saveCharacter(){

localStorage.setItem(
"studyQuestCharacter",
JSON.stringify(character)
);

alert(
language==="ar"

:"Your character has been saved ✨"
);
