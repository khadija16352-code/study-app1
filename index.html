<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quest</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    transition: .4s;
}

/* =========================
   LOGIN BACKGROUND
========================= */

body.neutral {
    background: linear-gradient(135deg, #e8e9ff, #f8f8ff);
}

body.girl {
    background: linear-gradient(135deg, #ffd6ea, #e7d8ff);
}

body.boy {
    background: linear-gradient(135deg, #ccecff, #d9d8ff);
}

/* =========================
   LOGIN
========================= */

.container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.login-card {
    width: 100%;
    max-width: 470px;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(18px);
    border-radius: 30px;
    padding: 38px;
    box-shadow: 0 25px 70px rgba(50,40,100,.15);
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
}

.language-title,
.gender-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

.languages,
.gender-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
}

button,
input,
select {
    font-family: inherit;
}

.language,
.gender {
    padding: 14px;
    border: 2px solid #eee;
    border-radius: 14px;
    background: white;
    cursor: pointer;
    font-size: 15px;
    transition: .2s;
}

.language.active {
    border-color: #806cff;
    background: #f4f1ff;
}

.input-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 2px solid #eee;
    border-radius: 13px;
    outline: none;
    font-size: 15px;
    background: white;
}

.gender.selected.girl {
    border-color: #ff72ae;
    background: #fff0f7;
}

.gender.selected.boy {
    border-color: #4d9cff;
    background: #eef7ff;
}

.continue {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 15px;
    background: #806cff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* =========================
   CUSTOMIZE SCREEN
========================= */

#customizeScreen {
    display: none;
    min-height: 100vh;
    padding: 30px;
}

.customize {
    max-width: 1100px;
    height: calc(100vh - 60px);
    margin: auto;

    background: rgba(255,255,255,.88);
    backdrop-filter: blur(20px);

    border-radius: 35px;
    box-shadow: 0 25px 80px rgba(50,40,100,.15);

    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
}

/* CHARACTER */

.character-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.character-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 25px;
}

.character {
    width: 270px;
    height: 400px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    position: relative;

    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

/* TEMP GAME CHARACTER */

.head {
    width: 115px;
    height: 125px;
    border-radius: 48% 48% 45% 45%;
    background: #f3c7a5;
    position: relative;
    z-index: 3;
}

.hair {
    position: absolute;
    top: -18px;
    left: -8px;

    width: 130px;
    height: 70px;

    border-radius: 65px 65px 30px 30px;
    background: #4b3428;

    z-index: 4;
}

.eye {
    position: absolute;
    width: 10px;
    height: 14px;
    border-radius: 50%;
    background: #222;
    top: 58px;
}

.eye.left {
    left: 30px;
}

.eye.right {
    right: 30px;
}

.smile {
    position: absolute;
    width: 28px;
    height: 12px;
    border-bottom: 3px solid #222;
    border-radius: 50%;
    left: 44px;
    top: 82px;
}

.body {
    width: 150px;
    height: 155px;
    background: #806cff;
    border-radius: 35px 35px 20px 20px;
    margin-top: -5px;
    z-index: 2;
}

.leg {
    width: 45px;
    height: 105px;
    background: #30354d;
    border-radius: 0 0 18px 18px;
}

.legs {
    display: flex;
    gap: 20px;
}

.shoe {
    width: 65px;
    height: 28px;
    background: white;
    border-radius: 20px;
    margin-top: -3px;
}

/* OPTIONS */

.options-area {
    padding: 45px;
    overflow-y: auto;
}

.options-area h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.options-area p {
    color: #777;
    margin-bottom: 25px;
}

.categories {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.category {
    border: none;
    background: #f2f2f7;
    padding: 11px 16px;
    border-radius: 13px;
    cursor: pointer;
    font-weight: bold;
}

.category.active {
    background: #806cff;
    color: white;
}

.items {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.item {
    min-height: 90px;
    border: 2px solid #eee;
    border-radius: 18px;
    background: white;
    cursor: pointer;
    font-size: 30px;
    transition: .2s;
}

.item:hover {
    transform: translateY(-3px);
}

.save-character {
    width: 100%;
    border: none;
    margin-top: 25px;
    padding: 16px;
    border-radius: 16px;
    background: #806cff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* MOBILE */

@media(max-width:800px) {

    body {
        overflow: auto;
    }

    .customize {
        height: auto;
        grid-template-columns: 1fr;
    }

    #customizeScreen {
        padding: 15px;
    }

    .options-area {
        padding: 25px;
    }
}
</style>

</head>

<body class="neutral">

<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="loginScreen">

<div class="container">

<div class="login-card">

<div class="logo">
📚 Study Quest
</div>

<div class="subtitle">
Start your study journey
</div>

<div class="language-title">
🌍 Language
</div>

<div class="languages">

<button class="language active"
id="englishBtn"
onclick="setLanguage('en')">
🇬🇧 English </button>

<button class="language"
id="arabicBtn"
onclick="setLanguage('ar')">
🇪🇬 العربية </button>

</div>

<div class="input-group">

<label id="nameLabel">
👤 Name
</label>

<input
id="name"
type="text"
placeholder="Enter your name">

</div>

<div class="input-group">

<label id="ageLabel">
🎂 Age
</label>

<input
id="age"
type="number"
min="5"
max="25"
placeholder="Enter your age">

</div>

<div class="input-group">

<label id="schoolLabel">
🎓 School year
</label>

<select id="school">

<option value="">
Select your school year
</option>

<option>Primary 1</option>
<option>Primary 2</option>
<option>Primary 3</option>
<option>Primary 4</option>
<option>Primary 5</option>
<option>Primary 6</option>

<option>Preparatory 1</option>
<option>Preparatory 2</option>
<option>Preparatory 3</option>

<option>Secondary 1</option>
<option>Secondary 2</option>
<option>Secondary 3</option>

</select>

</div>

<div class="gender-title" id="genderTitle">
👤 Choose your character type
</div>

<div class="gender-buttons">

<button
class="gender"
id="girlBtn"
onclick="chooseGender('girl')">
👧 Girl </button>

<button
class="gender"
id="boyBtn"
onclick="chooseGender('boy')">
👦 Boy </button>

</div>

<button class="continue" onclick="continueApp()">
Continue →
</button>

</div>
</div>
</div>

<!-- =========================
     CUSTOMIZE SCREEN
========================= -->

<div id="customizeScreen">

<div class="customize">

<!-- CHARACTER -->

<div class="character-area">

<div class="character-title">
✨ Your Character
</div>

<div class="character">

<div class="head">

<div class="hair" id="hair"></div>

<div class="eye left"></div>
<div class="eye right"></div>

<div class="smile"></div>

</div>

<div class="body" id="shirt"></div>

<div class="legs">

<div class="leg" id="pants1"></div>
<div class="leg" id="pants2"></div>

</div>

<div class="legs">

<div class="shoe" id="shoe1"></div>
<div class="shoe" id="shoe2"></div>

</div>

</div>

</div>

<!-- OPTIONS -->

<div class="options-area">

<h1>
Customize Character
</h1>

<p>
Create a character that feels like you.
</p>

<div class="categories">

<button
class="category active"
onclick="showCategory('hair')">
💇 Hair </button>

<button
class="category"
onclick="showCategory('clothes')">
👕 Clothes </button>

<button
class="category"
onclick="showCategory('pants')">
👖 Pants </button>

<button
class="category"
onclick="showCategory('shoes')">
👟 Shoes </button>

</div>

<div class="items" id="items"></div>

<button class="save-character"
onclick="saveCharacter()">
Save Character ✨ </button>

</div>

</div>

</div>

<script>

let language = "en";
let gender = "";
let currentCategory = "hair";


/* LANGUAGE */

function setLanguage(lang) {

language = lang;

document.getElementById("englishBtn")
.classList.toggle("active", lang === "en");

document.getElementById("arabicBtn")
.classList.toggle("active", lang === "ar");

if(lang === "ar") {

document.documentElement.lang = "ar";
document.documentElement.dir = "rtl";

document.querySelector(".subtitle").textContent =
"ابدأ رحلتك الدراسية";

document.querySelector(".language-title").textContent =
"🌍 اللغة";

document.getElementById("nameLabel").textContent =
"👤 الاسم";

document.getElementById("ageLabel").textContent =
"🎂 السن";

document.getElementById("schoolLabel").textContent =
"🎓 السنة الدراسية";

document.getElementById("genderTitle").textContent =
"👤 اختار نوع شخصيتك";

document.getElementById("name").placeholder =
"اكتب اسمك";

document.getElementById("age").placeholder =
"اكتب سنك";

document.querySelector(".continue").textContent =
"متابعة ←";

} else {

document.documentElement.lang = "en";
document.documentElement.dir = "ltr";

document.querySelector(".subtitle").textContent =
"Start your study journey";

document.querySelector(".language-title").textContent =
"🌍 Language";

document.getElementById("nameLabel").textContent =
"👤 Name";

document.getElementById("ageLabel").textContent =
"🎂 Age";

document.getElementById("schoolLabel").textContent =
"🎓 School year";

document.getElementById("genderTitle").textContent =
"👤 Choose your character type";

document.getElementById("name").placeholder =
"Enter your name";

document.getElementById("age").placeholder =
"Enter your age";

document.querySelector(".continue").textContent =
"Continue →";
}
}


/* GENDER */

function chooseGender(type) {

gender = type;

document.getElementById("girlBtn")
.classList.remove("selected");

document.getElementById("boyBtn")
.classList.remove("selected");

if(type === "girl") {

document.getElementById("girlBtn")
.classList.add("selected","girl");

document.body.className = "girl";

} else {

document.getElementById("boyBtn")
.classList.add("selected","boy");

document.body.className = "boy";
}
}


/* CONTINUE */

function continueApp() {

const name =
document.getElementById("name").value.trim();

const age =
document.getElementById("age").value;

const school =
document.getElementById("school").value;

if(!name || !age || !school || !gender) {

alert(
language === "ar"
? "من فضلك كمّل كل البيانات ❤️"
: "Please complete all the information ❤️"
);

return;
}

localStorage.setItem("studyQuestName",name);
localStorage.setItem("studyQuestAge",age);
localStorage.setItem("studyQuestSchool",school);
localStorage.setItem("studyQuestGender",gender);
localStorage.setItem("studyQuestLanguage",language);

document.getElementById("loginScreen").style.display = "none";
document.getElementById("customizeScreen").style.display = "block";

}


/* CATEGORY */

function showCategory(category) {

currentCategory = category;

document.querySelectorAll(".category")
.forEach(button => button.classList.remove("active"));

event.target.classList.add("active");

const items = document.getElementById("items");

items.innerHTML = "";

if(category === "hair") {

items.innerHTML = `
<button class="item" onclick="changeHair('#4b3428')">🤎</button>
<button class="item" onclick="changeHair('#222')">🖤</button>
<button class="item" onclick="changeHair('#d49b52')">💛</button>
`;

}

if(category === "clothes") {

items.innerHTML = `
<button class="item" onclick="changeShirt('#806cff')">💜</button>
<button class="item" onclick="changeShirt('#ff72ae')">🩷</button>
<button class="item" onclick="changeShirt('#4d9cff')">💙</button>
`;

}

if(category === "pants") {

items.innerHTML = `
<button class="item" onclick="changePants('#30354d')">🖤</button>
<button class="item" onclick="changePants('#496c9e')">💙</button>
<button class="item" onclick="changePants('#754c36')">🤎</button>
`;

}

if(category === "shoes") {

items.innerHTML = `
<button class="item" onclick="changeShoes('white')">🤍</button>
<button class="item" onclick="changeShoes('#222')">🖤</button>
<button class="item" onclick="changeShoes('#ff72ae')">🩷</button>
`;
}

}


/* CHANGES */

function changeHair(color) {
document.getElementById("hair").style.background = color;
}

function changeShirt(color) {
document.getElementById("shirt").style.background = color;
}

function changePants(color) {

document.getElementById("pants1").style.background = color;
document.getElementById("pants2").style.background = color;

}

function changeShoes(color) {

document.getElementById("shoe1").style.background = color;
document.getElementById("shoe2").style.background = color;

}


/* SAVE */

function saveCharacter() {

localStorage.setItem(
"studyQuestCharacterSaved",
"true"
);

alert(
language === "ar"
? "تم حفظ شخصيتك ✨"
: "Your character has been saved ✨"
);

}

showCategory("hair");

</script>

</body>
</html>
